  image_picker_android:
    path: vendor/image_picker_android
  image_picker_for_web:
    path: vendor/image_picker_for_web
  image_picker_ios:
    path: vendor/image_picker_ios
  image_picker_linux:
    path: vendor/image_picker_linux
  image_picker_macos:
    path: vendor/image_picker_macos
  image_picker_platform_interface:
    path: vendor/image_picker_platform_interface
  image_picker_windows:
    path: vendor/image_picker_windows
  camera_android_camerax:
    path: vendor/camera_android_camerax
  camera_avfoundation:
    path: vendor/camera_avfoundation
  camera_platform_interface:
    path: vendor/camera_platform_interface
  file_selector_android:
    path: vendor/file_selector_android
  file_selector_ios:
    path: vendor/file_selector_ios
  file_selector_linux:
