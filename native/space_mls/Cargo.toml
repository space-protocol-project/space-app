[package]
name = "space_mls"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false

[dependencies]
openmls = "=0.9.1"
openmls_basic_credential = "=0.6.0"
openmls_rust_crypto = "=0.6.0"
tls_codec = "=0.5.0"
chacha20poly1305 = "=0.10.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }
ed25519-dalek = { version = "=2.2.0", features = ["zeroize"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
cognitive_complexity = "deny"
