[package]
name = "space_mls"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false

[dependencies]
openmls = "=0.9.2"
openmls_libcrux_crypto = { version = "=0.4.0", path = "../vendor/openmls_libcrux_crypto" }
openmls_traits = "=0.6.0"
tls_codec = "=0.5.0"
chacha20poly1305 = "=0.11.0"
getrandom = "=0.4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = { version = "1", features = ["derive", "serde"] }
ed25519-dalek = { version = "=3.0.0", features = ["zeroize"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
cognitive_complexity = "deny"
