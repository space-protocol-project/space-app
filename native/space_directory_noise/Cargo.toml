[package]
name = "space_directory_noise"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
snow = "=0.10.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "=0.22.1"
zeroize = "1"
subtle = "2"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

