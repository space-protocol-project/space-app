name: space_admin_ui
publish_to: none
environment:
  sdk: ^3.13.7
dependencies:
  flutter_bloc: ^9.1.1
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.3.0
  image: ^4.12.0
  intl: ^0.20.3
  space_api:
    path: ../space_api
  xml: ^7.0.1

flutter:
  generate: true

# Согласовано с адаптацией cross_file в клиенте.
dependency_overrides:
  cross_file: 0.4.0
  file_selector_platform_interface:
    path: ../../client/vendor/file_selector_platform_interface
  file_selector_windows:
    path: ../../client/vendor/file_selector_windows
  file_selector_linux:
    path: ../../client/vendor/file_selector_linux
  file_selector_macos:
    path: ../../client/vendor/file_selector_macos
  file_selector_ios:
    path: ../../client/vendor/file_selector_ios
  file_selector_android:
    path: ../../client/vendor/file_selector_android
  file_selector_web:
    path: ../../client/vendor/file_selector_web
