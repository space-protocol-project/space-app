name: P1 авария клиента и восстановление сессии Linux
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  complexity:
    uses: ./.github/workflows/complexity.yml
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_DB: space_test
          POSTGRES_USER: space
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U space -d space_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      SPACE_TEST_DATABASE_URL: postgres://space:ci-only-password@127.0.0.1:5432/space_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: space-protocol-project/space-server
          ref: 5e6115a375ff3b86db128a86403ac2d21fc8d238
          path: .local/p1-command-server
      - uses: actions/setup-go@v5
        with:
          go-version-file: .local/p1-command-server/go.mod
          cache-dependency-path: .local/p1-command-server/go.sum
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.47.8', channel: stable, cache: true}
      - name: Подготовка окружения
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libx11-dev libxi-dev libsecret-1-dev libsecret-tools libnotify-dev xvfb xauth dbus-x11 gnome-keyring
          rustup toolchain install 1.99.1 --profile minimal
          mkdir -p .local/p1-command-crash
      - name: Анализ и регрессионные тесты
        working-directory: client
        run: |
          flutter pub get
          dart format lib/src/extensions_p1/command_cubit.dart test/extensions_p1_command_test.dart test/probes/extension_command_crash_probe.dart
          flutter analyze
          flutter test test/extensions_p1_retry_test.dart test/extensions_p1_command_test.dart --reporter expanded > ../.local/p1-command-crash/unit.txt
      - name: Сборка настоящего Flutter-клиента
        working-directory: client
        run: flutter build linux --debug --target test/probes/extension_command_crash_probe.dart
      - name: SIGKILL, холодное чтение Secret Service и новый вход
        env:
          SPACE_P1_DATABASE_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          cp tools/p1_command_bridge_test.go tools/p1_command_crash_test.go tools/p1_command_database_test.go .local/p1-command-server/internal/postgres/
          export SPACE_P1_NATIVE_COMMAND="$PWD/client/build/linux/x64/debug/bundle/space_client"
          export SPACE_P1_KEYRING_WRAPPER="$PWD/tools/directory_keyring_session.py"
          cd .local/p1-command-server
          go mod tidy
          go vet ./internal/postgres
          go mod verify
          xvfb-run -a go test -race -json ./internal/postgres -run '^TestExtensionClient(Crash|Database)Recovery$' -count=3 -timeout=15m > ../p1-command-crash/recovery.jsonl
      - name: Журнал восстановления PostgreSQL
        if: always()
        env:
          SPACE_P1_DATABASE_CONTAINER: ${{ job.services.postgres.id }}
        run: docker logs "$SPACE_P1_DATABASE_CONTAINER" > .local/p1-command-crash/postgres.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-command-crash-linux
          include-hidden-files: true
          path: |
            .local/p1-command-crash
            client/lib/src/extensions_p1/command_cubit.dart
            client/test/extensions_p1_command_test.dart
            client/test/probes/extension_command_crash_probe.dart
