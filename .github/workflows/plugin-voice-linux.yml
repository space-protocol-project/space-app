name: Голос P0 с управляемым аудио Linux
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: space
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U space"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      PGPASSWORD: ci-only-password
      PION_LOG_DEBUG: ice,turn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: space-protocol-project/space-server
          ref: 2e87fccbc7e994a801fa622ae66a548741ec9d9d
          path: server-source
      - uses: actions/setup-go@v5
        with: {go-version-file: server-source/go.mod, cache-dependency-path: server-source/go.sum}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.47.8', channel: stable, cache: true}
      - name: Системные зависимости и виртуальные аудиоустройства
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libx11-dev libxi-dev libsecret-1-dev libnotify-dev xvfb xauth dbus-x11 pulseaudio pulseaudio-utils postgresql-client
          rustup toolchain install 1.99.1 --profile minimal
      - uses: actions/cache@v4
        with:
          path: |
            client/build
            client/.dart_tool/hooks_runner
          key: p0-voice-linux-v1-${{ hashFiles('client/pubspec.lock', 'native/**/Cargo.lock', 'client/linux/**') }}
      - name: Анализ и сборка
        run: |
          go build -C server-source -o "$RUNNER_TEMP/space-voice-server" ./cmd/space-server
          go build -C server-source -o "$RUNNER_TEMP/space-voice-turn" ./cmd/space-voice-turn-check
          cd client
          flutter pub get
          dart format tool/voice_desktop_probe.dart tool/voice_desktop_checks.dart
          flutter analyze
          flutter build linux --release --target tool/voice_desktop_probe.dart
      - name: Прогрев и три повтора двух клиентов с TURN TCP
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=p0 sink_properties=device.description=P0
          pactl set-default-source p0.monitor
          pactl set-default-sink p0
          xvfb-run -a python3 tools/check_p0_voice_linux.py --server "$RUNNER_TEMP/space-voice-server" --turn "$RUNNER_TEMP/space-voice-turn" --client client/build/linux/x64/release/bundle/space_client --output "$RUNNER_TEMP/p0-voice"
          lscpu > "$RUNNER_TEMP/p0-voice/cpu.txt"
          free -b > "$RUNNER_TEMP/p0-voice/ram.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0-voice-linux
          retention-days: 30
          path: |
            ${{ runner.temp }}/p0-voice/*.txt
            ${{ runner.temp }}/p0-voice/voice-check-*/A*.json
            ${{ runner.temp }}/p0-voice/voice-check-*/B*.json
            ${{ runner.temp }}/p0-voice/voice-check-*/baseline.json
            ${{ runner.temp }}/p0-voice/voice-check-*/*.log
            ${{ runner.temp }}/p0-voice/voice-check-*/*-failure
            ${{ runner.temp }}/p0-voice/voice-check-*/*-candidate-types
            client/tool/voice_desktop_probe.dart
            client/tool/voice_desktop_checks.dart
