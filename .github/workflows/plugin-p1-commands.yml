name: P1 клиентские команды и настоящие квитанции
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  commands:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_DB: space_test
          POSTGRES_USER: space
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U space -d space_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      SPACE_TEST_DATABASE_URL: postgres://space:ci-only-password@127.0.0.1:5432/space_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: space-protocol-project/space-server
          ref: ae6fe2d0d3fffcb3024cbf896430b0ce4f5ee914
          path: .local/p1-command-server
      - uses: actions/setup-go@v5
        with:
          go-version-file: .local/p1-command-server/go.mod
          cache-dependency-path: .local/p1-command-server/go.sum
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.47.8', channel: stable, cache: true}
      - name: Подготовка клиента
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          cd client
          flutter pub get
          dart format lib/src/extensions_p1/command*.dart test/extensions_p1_command*.dart
          flutter analyze
      - name: Потеря ответа после настоящего commit и повтор той же команды
        run: |
          mkdir -p .local/p1-commands
          cp tools/p1_command_bridge_test.go .local/p1-command-server/internal/postgres/p1_command_bridge_test.go
          export SPACE_P1_FLUTTER_CLIENT="$PWD/client"
          cd .local/p1-command-server
          go mod tidy
          go test -race -json ./internal/postgres -run '^TestExtensionClientCommands$' -count=1 -timeout=12m > ../p1-commands/rpc.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-client-commands
          include-hidden-files: true
          path: |
            .local/p1-commands
            client/lib/src/extensions_p1/command*.dart
            client/test/extensions_p1_command*.dart
