name: Подготовка сопряжения v0.8.0
on:
  push:
    branches: [main]
    paths: ['client/build.yaml', 'client/lib/src/pairing*.dart', 'client/lib/ui/pairing*.dart', 'client/lib/ui/recovery_panel.dart', 'client/lib/ui/camera_scanner.dart', 'client/lib/src/*qr.dart', 'client/lib/l10n/**', 'packages/space_admin_ui/lib/**', 'client/test/pairing*_test.dart', 'client/test/probes/pairing_probe.dart', 'tools/check_pairing_ui.py', '.github/workflows/milestone-0-8.yml']
  workflow_dispatch:
    inputs:
      models:
        description: Повторно генерировать Freezed; сохранённые модели уже входят в исходники
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  complexity:
    uses: ./.github/workflows/complexity.yml
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Зависимости нативных модулей
        run: |
          printf 'https://archive.ubuntu.com/ubuntu\n' | sudo tee /etc/apt/apt-mirrors.txt
          timeout 180s sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update
          timeout 480s sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 install -y --no-install-recommends libgtk-3-dev libx11-dev libxi-dev libsecret-1-dev libnotify-dev xvfb xauth dbus-x11
      - name: Rust
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Генерация моделей по явному запросу
        if: inputs.models
        working-directory: client
        run: |
          flutter pub get
          timeout 300s dart run build_runner build
      - name: Форматирование, анализ и проверки сопряжения и архивов
        working-directory: client
        run: |
          flutter pub get
          dart format lib/src/pairing*.dart lib/src/recovery_qr.dart lib/src/space_link_qr.dart lib/ui/pairing*.dart lib/ui/recovery_panel.dart lib/ui/camera_scanner.dart test/pairing*_test.dart test/admin_recovery_views_test.dart test/probes/pairing_probe.dart tool/community_pairing_modes_interoperability.dart ../packages/space_admin_ui/lib/src/pairing_start_view.dart ../packages/space_admin_ui/lib/src/recovery_tools_view.dart
          dart fix --apply --code=curly_braces_in_flow_control_structures
          flutter analyze
          flutter test --no-pub test/pairing_lifetime_test.dart test/pairing_transport_test.dart test/pairing_qr_test.dart test/pairing_cubit_test.dart test/pairing_approval_cubit_test.dart test/pairing_panels_test.dart test/pairing_modes_test.dart test/pairing_selection_test.dart test/admin_recovery_views_test.dart test/space_qr_platform_test.dart test/camera_qr_test.dart test/recovery_test.dart test/recovery_spaces_test.dart test/recovery_qr_test.dart test/migration_archive_test.dart test/device_migration_test.dart test/device_recovery_batch_test.dart
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pairing-lifecycle-source
          path: |
            client/lib/src/**/*.freezed.dart
            client/lib/src/pairing*.dart
            client/lib/src/recovery_qr.dart
            client/lib/src/space_link_qr.dart
            client/lib/ui/pairing*.dart
            client/lib/ui/recovery_panel.dart
            client/lib/ui/camera_scanner.dart
            client/lib/l10n/app_localizations*.dart
            packages/space_admin_ui/lib/src/pairing_start_view.dart
            packages/space_admin_ui/lib/src/recovery_tools_view.dart
            client/test/pairing*_test.dart
            client/test/admin_recovery_views_test.dart
            client/test/probes/pairing_probe.dart
            client/tool/community_pairing_modes_interoperability.dart
      - name: Анализ пакета интерфейса
        working-directory: packages/space_admin_ui
        run: |
          flutter pub get
          flutter analyze
      - name: Нативный запрос, отмена и горячий перезапуск
        run: xvfb-run -a dbus-run-session -- python3 tools/check_pairing_ui.py --output "$RUNNER_TEMP/pairing-native"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pairing-native-ui
          path: ${{ runner.temp }}/pairing-native
