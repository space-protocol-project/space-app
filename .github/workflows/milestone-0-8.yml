name: Подготовка сопряжения v0.8.0
on:
  push:
    branches: ['codex/milestone-0-8-pairing']
    paths: ['client/lib/src/pairing*.dart', 'client/test/pairing*_test.dart', '.github/workflows/milestone-0-8.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  complexity:
    uses: ./.github/workflows/complexity.yml
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Зависимости нативных модулей
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libx11-dev libxi-dev libsecret-1-dev libnotify-dev
      - name: Rust
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Форматирование, анализ и проверки сопряжения и архивов
        working-directory: client
        run: |
          flutter pub get
          dart format lib/src/pairing.dart lib/src/pairing_lifetime.dart test/pairing_lifetime_test.dart test/pairing_transport_test.dart
          dart fix --apply --code=curly_braces_in_flow_control_structures
          flutter analyze
          flutter test --no-pub test/pairing_lifetime_test.dart test/pairing_transport_test.dart test/recovery_test.dart test/recovery_spaces_test.dart test/recovery_qr_test.dart test/migration_archive_test.dart test/device_migration_test.dart test/device_recovery_batch_test.dart
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pairing-lifecycle-source
          path: |
            client/lib/src/pairing.dart
            client/lib/src/pairing_lifetime.dart
            client/test/pairing_lifetime_test.dart
            client/test/pairing_transport_test.dart
