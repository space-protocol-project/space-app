name: P1 contributions client
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  complexity:
    uses: ./.github/workflows/complexity.yml
  client:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.47.8', channel: stable, cache: true}
      - name: Нативные зависимости тестового процесса Linux
        if: runner.os == 'Linux'
        run: |
          printf 'https://archive.ubuntu.com/ubuntu\n' | sudo tee /etc/apt/apt-mirrors.txt
          timeout 180s sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update
          timeout 480s sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 install -y clang cmake ninja-build pkg-config libgtk-3-dev libx11-dev libxi-dev
      - run: rustup toolchain install 1.99.1 --profile minimal
      - name: Анализ, транспорт, состояния, гонки и виджеты
        working-directory: client
        run: |
          flutter pub get
          flutter analyze
          dart run build_runner build
          git diff --exit-code -- lib/src/extensions_p1/contributions_cubit.freezed.dart
          flutter test test/extensions_p1_contributions_test.dart test/extensions_p1_contributions_rpc_test.dart test/extensions_p1_test.dart test/extensions_p1_form_test.dart --reporter expanded > contributions-tests.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contributions-${{ matrix.os }}
          path: client/contributions-tests.txt
          retention-days: 7
  native-windows:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: space-protocol-project/space-server
          ref: f12558aecaa8901685cb44a1f7b6b77a2b7ad6fd
          path: .local/p1-server
      - uses: actions/setup-go@v5
        with:
          go-version-file: .local/p1-server/go.mod
          cache-dependency-path: |
            .local/p1-server/go.sum
            .local/p1-server/experiments/extensions/go.sum
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.47.8', channel: stable, cache: true}
      - run: rustup toolchain install 1.99.1 --profile minimal
      - name: Сборка ядра с race и WASM-worker для Windows
        shell: pwsh
        run: |
          $nativeBin = Join-Path $env:GITHUB_WORKSPACE '.local/p1-native-bin'
          New-Item -ItemType Directory -Path $nativeBin -Force | Out-Null
          Push-Location .local/p1-server
          go test -race -c -o "$nativeBin/space-contributions-fixture.exe" ./internal/postgres
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location experiments/extensions
          go build -o "$nativeBin/space-contributions-worker.exe" ./cmd/p1-worker
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          Pop-Location
      - run: flutter pub get
        working-directory: client
      - name: Сборка клиента до выдачи короткой сессии ядра
        working-directory: client
        run: flutter build windows --debug --no-pub --target test/probes/contributions_probe.dart
      - name: Нативный список, открытие, ACL, сессия и перезапуск Windows
        run: python tools/run_contributions_ui.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contributions-native-windows
          include-hidden-files: true
          path: |
            .local/p1-contributions-client/native-result.json
            .local/p1-contributions-client/native-ui.log
            .local/p1-contributions-client/server.log
            .local/p1-contributions-client/postgres.log
            .local/p1-contributions-client/postgres-source.json
            .local/p1-contributions-client/postgres-stop.json
          retention-days: 7
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_DB: space_test
          POSTGRES_USER: space
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U space -d space_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: space-protocol-project/space-server
          ref: f12558aecaa8901685cb44a1f7b6b77a2b7ad6fd
          path: .local/p1-server
      - uses: actions/setup-go@v5
        with:
          go-version-file: .local/p1-server/go.mod
          cache-dependency-path: |
            .local/p1-server/go.sum
            .local/p1-server/experiments/extensions/go.sum
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.47.8', channel: stable, cache: true}
      - name: Инструменты Linux
        run: |
          printf 'https://archive.ubuntu.com/ubuntu\n' | sudo tee /etc/apt/apt-mirrors.txt
          timeout 180s sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update
          timeout 480s sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 install -y clang cmake ninja-build pkg-config libgtk-3-dev libx11-dev libxi-dev libsecret-1-dev libnotify-dev xvfb dbus-x11
          sudo sh -c 'echo "+memory +pids +cpu" > /sys/fs/cgroup/cgroup.subtree_control'
          rustup toolchain install 1.99.1 --profile minimal
      - name: Сборка настоящего ядра и WASM-worker
        working-directory: .local/p1-server
        run: |
          go test -race -c -o /tmp/space-contributions-fixture ./internal/postgres
          (cd experiments/extensions && go build -o /tmp/space-contributions-worker ./cmd/p1-worker)
      - run: flutter pub get
        working-directory: client
      - name: Сборка клиента до выдачи короткой сессии ядра
        working-directory: client
        run: flutter build linux --debug --no-pub --target test/probes/contributions_probe.dart
      - name: Список, открытие, ACL, выход и перезапуск
        env:
          SPACE_TEST_DATABASE_URL: postgres://space:ci-only-password@127.0.0.1:5432/space_test?sslmode=disable
        run: dbus-run-session -- python3 tools/run_contributions_ui.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contributions-native-linux
          include-hidden-files: true
          path: |
            .local/p1-contributions-client/native-result.json
            .local/p1-contributions-client/native-ui.log
            .local/p1-contributions-client/server.log
          retention-days: 7
