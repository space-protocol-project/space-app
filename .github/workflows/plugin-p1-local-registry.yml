name: P1 постоянный локальный реестр
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  complexity:
    uses: ./.github/workflows/complexity.yml
  registry:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.47.8', channel: stable, cache: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/setup-go@v5
        with: {go-version-file: native/space_catalog/go.mod, cache: false}
      - name: Файловый адаптер каталога
        working-directory: native/space_catalog
        shell: bash
        run: |
          mkdir -p ../../.local/registry
          go test -v ./... | tee ../../.local/registry/catalog-go.txt
          go build -o ../../.local/registry/space-catalog.exe .
      - name: Нативные зависимости Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libx11-dev libxi-dev libsecret-1-dev libnotify-dev xvfb dbus-x11
      - name: Инструменты собственных нативных пакетов
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Подготовка
        working-directory: client
        run: flutter pub get
      - name: Анализ
        working-directory: client
        run: flutter analyze
      - name: Тесты реестра и прежних контрактов
        env:
          SPACE_CATALOG_HELPER: ${{ github.workspace }}/.local/registry/space-catalog.exe
        working-directory: client
        shell: bash
        run: |
          mkdir -p ../.local/registry
          flutter test test/probes/desktop_catalog_acceptance.dart test/local_profile_test.dart test/local_profile_widget_test.dart test/device_panel_test.dart test/local_session_scope_test.dart test/app_test.dart test/app_shutdown_test.dart test/local_lifecycle_test.dart test/local_registry_test.dart test/extensions_p1_test.dart test/extensions_p1_retry_test.dart --reporter expanded > ../.local/registry/unit.txt
      - name: Системный выбор каталога GTK и чтение через хост
        if: runner.os == 'Linux'
        working-directory: client
        env:
          SPACE_CATALOG_HELPER: ${{ github.workspace }}/.local/registry/space-catalog.exe
        run: |
          flutter build linux --debug --target test/probes/desktop_catalog_picker_probe.dart
          cc -shared -fPIC ../tools/catalog_picker_gtk.c -o "$RUNNER_TEMP/catalog-picker.so" $(pkg-config --cflags --libs gtk+-3.0)
          dbus-run-session -- xvfb-run -a python ../tools/check_desktop_catalog_picker.py build/linux/x64/debug/bundle/space_client ../.local/registry/picker.json "$RUNNER_TEMP/catalog-picker.so"
      - name: Настоящий исполняемый процесс Dart
        working-directory: client
        run: dart compile exe test/probes/local_registry_probe.dart -o ../.local/registry/probe.exe
      - name: Принудительное завершение и восстановление
        shell: bash
        run: python tools/check_local_registry_crash.py .local/registry/probe.exe > .local/registry/crash.json
      - name: Исполняемый хост жизненного цикла
        working-directory: client
        run: dart compile exe test/probes/local_lifecycle_probe.dart -o ../.local/registry/lifecycle.exe
      - name: Сбой публикации через хост жизненного цикла
        shell: bash
        run: python tools/check_local_lifecycle_crash.py .local/registry/lifecycle.exe > .local/registry/lifecycle-crash.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-registry-${{ matrix.os }}
          path: |
            .local/registry/picker.json
            .local/registry/catalog-go.txt
            .local/registry/unit.txt
            .local/registry/crash.json
            .local/registry/lifecycle-crash.json
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: profile-localizations
          path: client/lib/l10n/app_localizations*.dart
