name: Голосовые комнаты P0
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  complexity:
    uses: ./.github/workflows/complexity.yml
  voice:
    runs-on: windows-2025
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with: {path: space-app}
      - uses: actions/checkout@v4
        with:
          repository: space-protocol-project/space-server
          ref: 2e87fccbc7e994a801fa622ae66a548741ec9d9d
          path: space-server
      - uses: actions/setup-go@v5
        with: {go-version-file: space-server/go.mod}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.47.8', channel: stable, cache: true}
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: flutter pub get
        working-directory: space-app/client
      - uses: actions/cache/restore@v4
        id: voice-cache
        with:
          path: |
            space-app/client/build
            space-app/client/.dart_tool/hooks_runner
          key: p0-voice-windows-v1-${{ hashFiles('space-app/client/pubspec.lock', 'space-app/native/**/Cargo.lock', 'space-app/client/windows/**') }}
      - name: Анализ и регрессия голоса
        working-directory: space-app/client
        run: |
          dart format tool/voice_desktop_probe.dart tool/voice_desktop_checks.dart
          flutter analyze
          if ($LASTEXITCODE) { throw 'Анализ не прошёл' }
          flutter test test/voice_controller_test.dart test/voice_recovery_test.dart test/voice_network_test.dart
          if ($LASTEXITCODE) { throw 'Регрессия голоса' }
      - name: Закреплённый комплект PostgreSQL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content space-app/client/assets/home/runtime-manifest.json -Raw | ConvertFrom-Json
          $entry = $manifest.'windows-x64'
          $archive = Join-Path $env:RUNNER_TEMP 'voice-runtime.zip'
          Invoke-WebRequest -Uri $entry.url -OutFile $archive
          if ((Get-Item $archive).Length -ne $entry.bytes -or (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $entry.sha256) { throw 'Архив не прошёл проверку' }
          Expand-Archive -LiteralPath $archive -DestinationPath (Join-Path $env:RUNNER_TEMP 'voice-runtime')
      - name: Два Windows-клиента, TURN TCP и перезапуск сервера
        env:
          PION_LOG_DEBUG: ice,turn
        shell: pwsh
        working-directory: space-app
        run: |
          # Один прогревочный и три измеряемых раунда на той же машине.
          foreach ($round in 0..3) {
            $env:SPACE_VOICE_BASELINE_ROUND = "$round"
            ./tools/check_voice_rooms.ps1 -Runtime "$env:RUNNER_TEMP/voice-runtime" -Relay tcp -Recovery
          }
      - uses: actions/cache/save@v4
        if: always() && steps.voice-cache.outputs.cache-hit != 'true'
        with:
          path: |
            space-app/client/build
            space-app/client/.dart_tool/hooks_runner
          key: ${{ steps.voice-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0-voice-tcp-recovery
          retention-days: 30
          include-hidden-files: true
          if-no-files-found: error
          path: |
            space-app/client/tool/voice_desktop_probe.dart
            space-app/client/tool/voice_desktop_checks.dart
            space-app/.local/voice-check-*/A.json
            space-app/.local/voice-check-*/B.json
            space-app/.local/voice-check-*/*-metrics.json
            space-app/.local/voice-check-*/*-timeline.json
            space-app/.local/voice-check-*/baseline.json
            space-app/.local/voice-check-*/*.log
            space-app/.local/voice-check-*/A-failure
            space-app/.local/voice-check-*/B-failure
            space-app/.local/voice-check-*/*-offer-ms
            space-app/.local/voice-check-*/*-answer-ms
            space-app/.local/voice-check-*/*-candidate-types
            space-app/.local/voice-check-*/*-inbound-stats
            space-app/.local/voice-check-*/*-media
