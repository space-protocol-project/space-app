name: Проверки экспериментального MLS
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['native/**', 'packages/space_mls_native/**', 'client/lib/src/mls/**', 'client/lib/src/rpc_*.dart', 'client/test/mls*', 'client/test/rpc*', 'client/test/support/rpc_fault_proxy.dart', 'tools/check_mls_advisories*', 'tools/collect_mls_notices.py', '.github/workflows/mls.yml']
  pull_request:
    paths: ['native/**', 'packages/space_mls_native/**', 'client/lib/src/mls/**', 'client/lib/src/rpc_*.dart', 'client/test/mls*', 'client/test/rpc*', 'client/test/support/rpc_fault_proxy.dart', 'tools/check_mls_advisories*', 'tools/collect_mls_notices.py', '.github/workflows/mls.yml']
permissions:
  contents: read
jobs:
  hostile-server:
    name: Недоверенный сервер, откат и бюджеты
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Системные зависимости нативных модулей Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libx11-dev libxi-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
      - name: Rust для нативного моста
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Отрицательные сценарии с настоящим MLS и HTTP
        working-directory: client
        run: |
          flutter pub get
          flutter test test/mls_hostile_server_test.dart test/mls_envelope_checks_test.dart test/mls_recovery_test.dart test/rpc_budget_test.dart test/rpc_connection_test.dart
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: native/space_mls
    steps:
      - uses: actions/checkout@v4
      - name: Установка закреплённого Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy --component rustfmt
      - name: Форматирование
        run: cargo fmt --check
      - name: Анализ
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Формат и анализ моста Flutter
        run: |
          cargo fmt --manifest-path ../space_mls_bridge/Cargo.toml --check
          cargo clippy --locked --manifest-path ../space_mls_bridge/Cargo.toml --all-targets -- -D warnings
      - name: Закрытый канал, сообщения и вложения
        run: cargo test --locked
      - name: Совместимость с mls-rs
        if: matrix.os == 'ubuntu-24.04'
        run: cargo test --locked --manifest-path ../mls_interop/Cargo.toml
      - uses: actions/setup-python@v5
        if: matrix.os == 'ubuntu-24.04'
        with:
          python-version: '3.12'
      - name: Известные уязвимости активных зависимостей
        if: matrix.os == 'ubuntu-24.04'
        run: |
          python -m unittest discover -s ../../tools -p 'check_mls_advisories_test.py'
          python ../../tools/check_mls_advisories.py
  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: native/space_mls
    steps:
      - uses: actions/checkout@v4
      - name: Rust для Android ARM64
        run: rustup toolchain install 1.99.1 --profile minimal --target aarch64-linux-android
      - name: Проверка сборки ядра для Android
        run: |
          cargo check --locked --target aarch64-linux-android
          cargo check --locked --manifest-path ../space_mls_bridge/Cargo.toml --target aarch64-linux-android
