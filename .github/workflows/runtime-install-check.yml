name: Установка опубликованного runtime
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-14, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Зависимости приложения
        working-directory: client
        run: flutter pub get
      - name: Скачивание из публичного релиза, установка и перезапуск
        working-directory: client
        env:
          SPACE_HOME_INSTALL_CHECK: '1'
        run: flutter test --no-pub test/home_runtime_install_test.dart
