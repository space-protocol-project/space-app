name: Установщики приложения
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['native/**', 'client/**', 'packages/**', 'packaging/**', 'tools/check_attachments.ps1', 'tools/check_desktop_chat_ci.ps1', 'tools/check_secure_storage.ps1', 'tools/check_linux_notification_activation.py', 'tools/secure_storage_atomic_test.cpp', 'Changelog.md', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['native/**', 'client/**', 'packages/**', 'packaging/**', 'tools/check_attachments.ps1', 'tools/check_desktop_chat_ci.ps1', 'tools/check_secure_storage.ps1', 'tools/check_linux_notification_activation.py', 'tools/secure_storage_atomic_test.cpp', 'Changelog.md', '.github/workflows/desktop.yml']
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false
jobs:
  complexity:
    uses: ./.github/workflows/complexity.yml
  validate:
    needs: complexity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Проверка подготовки и публикации выпусков
        run: python3 -m unittest discover -s packaging -p '*_test.py'
      - name: Проверка тега и changelog до сборки
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 packaging/check-release.py "$GITHUB_REF_NAME"
  verify-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    uses: space-protocol-project/space-server/.github/workflows/server.yml@main
    with:
      app_ref: ${{ github.sha }}
  verify-mls:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    uses: ./.github/workflows/mls.yml
  desktop:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: windows
          - os: macos-15
            target: macos
          - os: ubuntu-24.04
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Версия из тега
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: python packaging/stamp-app-version.py "$GITHUB_REF_NAME"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Зависимости Linux (только CI)
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libnotify-dev xvfb xauth dbus-x11 python3-gi
      - name: Зависимости приложения
        working-directory: client
        run: flutter pub get
      - name: Уведомления и переходы между пространствами
        working-directory: client
        run: flutter test test/android_push_test.dart test/system_notifications_test.dart test/notification_targets_test.dart test/notification_navigation_test.dart test/chat_notifications_test.dart test/mls_notifications_test.dart test/mls_notification_delivery_test.dart
      - name: Markdown и раскладка обычного и MLS-чата
        working-directory: client
        run: flutter test test/composer_markdown_test.dart test/mls_view_test.dart
      - name: Голосовые комнаты и завершение захвата микрофона
        working-directory: client
        run: flutter test test/voice_network_test.dart test/voice_controller_test.dart test/voice_widgets_test.dart test/channels_test.dart
      - name: Атомарная запись защищённого состояния Windows
        if: matrix.target == 'windows'
        shell: pwsh
        run: ./tools/check_secure_storage.ps1
      - name: Эталонные изображения Windows
        if: matrix.target == 'windows'
        working-directory: client
        run: flutter test test/redesign_golden_test.dart
      - name: Различия эталонных изображений
        if: failure() && matrix.target == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: Windows-golden-differences
          path: client/test/failures/**
          if-no-files-found: ignore
      - name: Сборка
        working-directory: client
        shell: bash
        run: |
          version=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version=${GITHUB_REF_NAME#v}; fi
          native_version=${version%%-*}
          flutter build ${{ matrix.target }} --release --build-name "$native_version"
      - name: Windows Setup
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $appVersion = (Select-String -Path client/pubspec.yaml -Pattern '^version: (.+?)(\+.*)?$').Matches.Groups[1].Value
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $appVersion = $env:GITHUB_REF_NAME.Substring(1) }
          $appNumericVersion = ($appVersion -split '-')[0]
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$appVersion" "/DAppNumericVersion=$appNumericVersion" packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash dist/Space-Setup-windows-x64.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  Space-Setup-windows-x64.exe" } | Set-Content dist/SHA256SUMS-windows-x64.txt
      - name: macOS DMG
        if: matrix.target == 'macos'
        run: bash packaging/build-macos.sh
      - name: Linux RUN
        if: matrix.target == 'linux'
        run: |
          bash packaging/build-linux.sh
          (cd dist && sha256sum -- *.run > SHA256SUMS-linux-x64.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: Space-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Нативный запуск Linux из уведомления
        if: matrix.target == 'linux'
        shell: bash
        run: |
          (cd client && flutter build linux --release --no-pub --target tool/notification_activation_probe.dart)
          /usr/bin/python3 tools/check_linux_notification_activation.py dist/Space-linux-x64.run client/build/linux/x64/release/bundle
      - name: Нативная очередь нажатия macOS до готовности Dart
        if: matrix.target == 'macos'
        working-directory: client
        run: xcodebuild test -workspace macos/Runner.xcworkspace -scheme Runner -configuration Debug -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO
      - name: Проверка установки поверх v0.2.1 и перезапуска
        if: matrix.target == 'windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $candidateBundle = Join-Path $env:RUNNER_TEMP 'space-update-candidate'
          Copy-Item -LiteralPath client/build/windows/x64/runner/Release -Destination $candidateBundle -Recurse
          Push-Location client
          flutter build windows --release --no-pub --target tool/app_update_install_probe.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          ./packaging/check-windows-update.ps1 -Probe client/build/windows/x64/runner/Release/space_client.exe -Installer dist/Space-Setup-windows-x64.exe -CandidateExecutable (Join-Path $candidateBundle 'space_client.exe')
      - name: Журналы проверки обновления Windows
        if: always() && matrix.target == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: Windows-update-check
          path: |
            ${{ runner.temp }}/Space update check */*.log
            ${{ runner.temp }}/Space update check */*.json
            ${{ runner.temp }}/Space update check */*.error
          if-no-files-found: warn
          retention-days: 14
  android:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Зависимости приложения
        working-directory: client
        run: flutter pub get
      - name: Подпись выпуска Android
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SPACE_ANDROID_KEYSTORE: ${{ secrets.SPACE_ANDROID_KEYSTORE }}
          SPACE_ANDROID_STORE_PASSWORD: ${{ secrets.SPACE_ANDROID_STORE_PASSWORD }}
          SPACE_ANDROID_KEY_PASSWORD: ${{ secrets.SPACE_ANDROID_KEY_PASSWORD }}
          SPACE_ANDROID_KEY_ALIAS: ${{ secrets.SPACE_ANDROID_KEY_ALIAS }}
        run: python3 packaging/prepare-android-signing.py
      - name: Сборка Android
        working-directory: client
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            flutter build apk --release --build-name "${GITHUB_REF_NAME#v}"
            mkdir -p ../dist
            cp build/app/outputs/flutter-apk/app-release.apk ../dist/Space-android.apk
            (cd ../dist && sha256sum Space-android.apk > SHA256SUMS-android.txt)
          else
            flutter build apk --debug
          fi
      - name: Совместимость приватного push runtime и Android
        working-directory: client/android
        run: ./gradlew :app:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: Space-android
          path: dist/*
          if-no-files-found: error
  chat-e2e:
    name: Интерфейс чата и отдельная PostgreSQL
    needs: validate
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: app-source
      - uses: actions/checkout@v4
        with:
          repository: space-protocol-project/space-server
          # Совместимая версия runtime v0.7.0, схема 23.
          ref: 6942a97f7a30d5d952d9a52cd523204e68262743
          path: space-server
      - uses: actions/setup-go@v5
        with:
          go-version-file: space-server/go.mod
          cache-dependency-path: space-server/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Rust для настоящего MLS-ядра
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: UI → RPC → PostgreSQL → второй клиент
        working-directory: app-source
        shell: pwsh
        run: ./tools/check_desktop_chat_ci.ps1
      - name: Журналы изолированной проверки
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-chat-logs
          path: |
            ${{ runner.temp }}/desktop-chat-*/postgres.log
            ${{ runner.temp }}/desktop-chat-*/space_v03_*/server.*.log
          if-no-files-found: warn
          retention-days: 7
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [validate, desktop, android, chat-e2e, verify-release, verify-mls]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Space-*
          path: dist
          merge-multiple: true
      - name: Описание из Changelog.md
        run: python3 packaging/release-notes.py "$GITHUB_REF_NAME" Changelog.md dist/release-notes.md
      - name: Публикация проверенного выпуска
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 packaging/publish-release.py app "$GITHUB_REF_NAME" dist
