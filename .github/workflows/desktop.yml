name: Установщики приложения
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['client/**', 'packages/**', 'packaging/**', 'Changelog.md', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['client/**', 'packages/**', 'packaging/**', 'Changelog.md', '.github/workflows/desktop.yml']
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Проверка подготовки и публикации выпусков
        run: python3 -m unittest discover -s packaging -p '*_test.py'
      - name: Проверка тега и changelog до сборки
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 packaging/check-release.py "$GITHUB_REF_NAME"
  verify-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    uses: space-protocol-project/space-server/.github/workflows/server.yml@main
    with:
      app_ref: ${{ github.sha }}
  desktop:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: windows
          - os: macos-14
            target: macos
          - os: ubuntu-22.04
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Версия из тега
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: python packaging/stamp-app-version.py "$GITHUB_REF_NAME"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Зависимости Linux (только CI)
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev
      - name: Зависимости приложения
        working-directory: client
        run: flutter pub get
      - name: Сборка
        working-directory: client
        shell: bash
        run: |
          version=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version=${GITHUB_REF_NAME#v}; fi
          native_version=${version%%-*}
          flutter build ${{ matrix.target }} --release --build-name "$native_version"
      - name: Windows Setup
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $appVersion = (Select-String -Path client/pubspec.yaml -Pattern '^version: (.+?)(\+.*)?$').Matches.Groups[1].Value
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $appVersion = $env:GITHUB_REF_NAME.Substring(1) }
          $appNumericVersion = ($appVersion -split '-')[0]
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$appVersion" "/DAppNumericVersion=$appNumericVersion" packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash dist/Space-Setup-windows-x64.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  Space-Setup-windows-x64.exe" } | Set-Content dist/SHA256SUMS-windows-x64.txt
      - name: macOS DMG
        if: matrix.target == 'macos'
        run: bash packaging/build-macos.sh
      - name: Linux RUN
        if: matrix.target == 'linux'
        run: |
          bash packaging/build-linux.sh
          (cd dist && sha256sum *.run > SHA256SUMS-linux-x64.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: Space-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Проверка установки поверх v0.2.1 и перезапуска
        if: matrix.target == 'windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $candidateBundle = Join-Path $env:RUNNER_TEMP 'space-update-candidate'
          Copy-Item -LiteralPath client/build/windows/x64/runner/Release -Destination $candidateBundle -Recurse
          Push-Location client
          flutter build windows --release --no-pub --target tool/app_update_install_probe.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          ./packaging/check-windows-update.ps1 -Probe client/build/windows/x64/runner/Release/space_client.exe -Installer dist/Space-Setup-windows-x64.exe -CandidateExecutable (Join-Path $candidateBundle 'space_client.exe')
      - name: Журналы проверки обновления Windows
        if: always() && matrix.target == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: Windows-update-check
          path: |
            ${{ runner.temp }}/Space update check */*.log
            ${{ runner.temp }}/Space update check */*.json
            ${{ runner.temp }}/Space update check */*.error
          if-no-files-found: warn
          retention-days: 14
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [validate, desktop, verify-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Space-*
          path: dist
          merge-multiple: true
      - name: Описание из Changelog.md
        run: python3 packaging/release-notes.py "$GITHUB_REF_NAME" Changelog.md dist/release-notes.md
      - name: Публикация проверенного выпуска
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 packaging/publish-release.py app "$GITHUB_REF_NAME" dist
